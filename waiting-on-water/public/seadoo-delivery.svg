<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-labelledby="sdTitle">
  <title id="sdTitle">Sea-Doo style personal watercraft on the water</title>
  <defs>
    <linearGradient id="water" x1="0" y1="180" x2="640" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0c4a6e" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#0891b2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0e7490" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="hull" x1="120" y1="120" x2="520" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="spray" x1="80" y1="200" x2="240" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e0f2fe" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" rx="24" fill="url(#water)"/>
  <path fill="#164e63" fill-opacity="0.35" d="M0 220c80-20 160-20 240 0s160 20 240 0 160-20 240 0V360H0z"/>
  <path fill="#155e75" fill-opacity="0.25" d="M0 240c100-12 200-12 300 0s200 12 300 0 200-12 300 0V360H0z"/>
  <!-- spray -->
  <ellipse cx="140" cy="210" rx="90" ry="45" fill="url(#spray)" opacity="0.85"/>
  <path stroke="#f0f9ff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" d="M200 200l-40 8M210 215l-48 4M195 228l-42-6"/>
  <!-- hull -->
  <path
    fill="url(#hull)"
    d="M180 200c20-35 95-55 180-45 55 8 95 28 110 55 8 15 4 32-12 38-25 10-65 8-95-5-45-20-95-25-140-10-25 8-45 2-50-18-3-10 2-20 7-15z"
  />
  <path fill="#0f766e" fill-opacity="0.5" d="M220 195c35-8 75-5 110 8 25 10 42 25 48 42-40-15-95-18-140-5-22 7-38 2-42-12-2-12 10-28 24-33z"/>
  <!-- handle / rider silhouette -->
  <path fill="#134e4a" d="M340 165c8-12 22-18 36-14 12 4 18 16 14 28l-8 28h-18l6-22c-12 4-24 2-34-6-10-8-8-20 4-14z"/>
  <ellipse cx="378" cy="148" rx="14" ry="15" fill="#134e4a"/>
  <path stroke="#ccfbf1" stroke-opacity="0.4" stroke-width="2" d="M395 175c40 8 85 5 120-8"/>
</svg>
